name: Hourly collect and publish

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "data/**"
      - "frontend/data/**"
      - "README.md"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: hourly-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -r requirements.txt
      - name: Collect marketplace asks
        run: python -m app.collect
        continue-on-error: true
      - name: Export dashboard snapshot
        run: python -m app.export_static
      - name: Persist database and snapshot
        run: |
          git add data/tracker.db frontend/data/snapshot.json
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "Refresh hourly market snapshot"
            git push
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend
      - id: deployment
        uses: actions/deploy-pages@v4
